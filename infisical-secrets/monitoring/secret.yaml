apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: monitoring-inf-secret
  labels: { }
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  syncConfig:
    resyncInterval: 10s
  authentication:
    kubernetesAuth:
      identityId: ea9c7e43-4921-4cac-bac7-8fc8b1a24440
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: infisical2
      secretsScope:
        projectSlug: monitoring
        envSlug: prod
        secretsPath: /
        recursive: true
  managedKubeSecretReferences:
    - secretName: monitoring-secrets
      secretNamespace: monitoring
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        data:
          objstore.yml: |
            type: S3
            config:
              bucket: thanos
              endpoint: 10.10.10.100:7070
              insecure: true
              bucket_lookup_type: path
              access_key: "{{ .S3_ACCESS_KEY_ID.Value }}"
              secret_key: "{{ .S3_SECRET_ACCESS_KEY.Value }}"
        metadata:
          annotations:
            helm.sh/hook: pre-install
            helm.sh/hook-weight: "-5"
            helm.sh/hook-delete-policy: before-hook-creation
