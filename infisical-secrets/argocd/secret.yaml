apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: argocd-inf-secret
  labels: { }
spec:
  syncConfig:
    resyncInterval: 10s
  authentication:
    kubernetesAuth:
      identityId: ea9c7e43-4921-4cac-bac7-8fc8b1a24440
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: infisical2
      secretsScope:
        projectSlug: argocd
        envSlug: prod
        secretsPath: /
        recursive: true
  managedKubeSecretReferences:
    - secretName: argocd-notifications-secret
      secretNamespace: argocd
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          github-appID: "{{ .GITHUB_APP_ID.Value }}"
          github-installationID: "{{ .GITHUB_APP_INSTALLATION_ID.Value }}"
          github-privateKey: "{{ .GITHUB_APP_PRIVATE_KEY.Value }}"
    - secretName: github-app-primerdriver
      secretNamespace: argocd
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        metadata:
          labels:
            argocd.argoproj.io/secret-type: repo-creds
        data:
          # Full repo URL, not the org prefix: the App is installed on primerdriver only.
          url: https://github.com/kvdomingo/primerdriver
          githubAppID: "{{ .GITHUB_APP_ID.Value }}"
          githubAppInstallationID: "{{ .GITHUB_APP_INSTALLATION_ID.Value }}"
          githubAppPrivateKey: "{{ .GITHUB_APP_PRIVATE_KEY.Value }}"
