apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ include "renovate.fullname" . }}-configmap'
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
data:
  config.json5: |-
    {
      "globalExtends": [
        "config:recommended",
        ":semanticCommits",
      ],
      "onboarding": true,
      "repositories": [
        "kvdomingo/banyuhay",
        "kvdomingo/hannibot",
        "kvdomingo/homelab-automation",
        "kvdomingo/primerdriver",
      ],
      "separateMinorPatch": true,
      // Not under "force": forced packageRules replace each repo's own rules.
      "packageRules": [
        {
          "description": "Libraries: minor and patch only",
          "matchCategories": ["js", "python"],
          "matchUpdateTypes": ["major"],
          "enabled": false,
        },
        {
          "description": "Library and tooling images, e.g. `COPY --from=` in Dockerfiles",
          "matchDatasources": ["docker"],
          "matchPackageNames": ["ghcr.io/astral-sh/uv"],
          "matchUpdateTypes": ["major"],
          "enabled": false,
        },
        {
          "description": "Languages: patch only",
          "matchDatasources": ["python-version", "node-version", "golang-version"],
          "matchUpdateTypes": ["major", "minor"],
          "enabled": false,
        },
        {
          "description": "Language images under any registry or namespace, e.g. python, docker.io/library/node, oven/bun",
          "matchDatasources": ["docker"],
          "matchPackageNames": ["/^(.+/)?(python|node|golang|bun|deno)$/"],
          "matchUpdateTypes": ["major", "minor"],
          "enabled": false,
        },
        {
          "description": "Terraform/OpenTofu providers: minor and patch only",
          "matchDatasources": ["terraform-provider"],
          "matchUpdateTypes": ["major"],
          "enabled": false,
        },
      ],
    }
