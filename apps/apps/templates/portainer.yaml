{{- if not .Values.disablePortainer }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portainer
  namespace: {{ include "apps.argocdNamespace" . | quote }}
  finalizers:
    {{- include "apps.finalizers" . | nindent 4 }}
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://portainer.github.io/k8s/
    chart: portainer
    targetRevision: 245.2.0
    helm:
      releaseName: portainer
      valuesObject:
        replicaCount: 1
        enterpriseEdition:
          enabled: false
        image:
          # renovate: datasource=docker depName=portainer/portainer-ce
          tag: "2.45.2"
        service:
          type: ClusterIP
        localMgmt: true
        trusted_origins:
          enabled: true
          domains: "https://portainer.kvd.studio,https://portainer.lab.kvd.studio"
        ingress:
          enabled: true
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Portainer"
            gethomepage.dev/group: "Admin"
            gethomepage.dev/icon: "portainer.png"
            gethomepage.dev/ping: "portainer.{{ .Values.ingress.baseDomain }}"
          hosts:
            - host: "portainer.{{ .Values.ingress.baseDomain }}"
              paths:
                - path: /
        persistence:
          enabled: true
          annotations:
            argocd.argoproj.io/sync-options: Delete=false,Prune=false
  destination:
    server: {{ .Values.destination.server }}
    namespace: portainer
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
{{- end }}
