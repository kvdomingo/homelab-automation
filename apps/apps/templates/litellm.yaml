{{- if not .Values.disableLiteLLM }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: {{ include "apps.argocdNamespace" . | quote }}
  finalizers:
    {{- include "apps.finalizers" . | nindent 4 }}
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: https://github.com/kvdomingo/homelab-automation.git
      targetRevision: main
      path: infisical-secrets/litellm
    - repoURL: oci://ghcr.io/berriai/litellm-helm
      path: .
      targetRevision: 1.102.0
      helm:
        releaseName: litellm
        valuesObject:
          image:
            tag: latest
          deploymentAnnotations:
            keel.sh/policy: "force"
            keel.sh/trigger: "poll"
            keel.sh/match-tag: "true"
            secrets.infisical.com/auto-reload: "true"
          ingress:
            enabled: true
            className: traefik
            annotations:
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: "LiteLLM"
              gethomepage.dev/group: "AI"
              gethomepage.dev/icon: "litellm.webp"
              gethomepage.dev/ping: "https://litellm.lab.kvd.studio/health/liveliness"
            hosts:
              - host: litellm.lab.kvd.studio
                paths:
                  - path: /
                    pathType: Prefix
              - host: litellm.kvd.studio
                paths:
                  - path: /
                    pathType: Prefix
          masterkeySecretName: litellm-secrets
          masterkeySecretKey: MASTER_KEY
          proxyConfigMap:
            create: false
            name: litellm-configmap
            key: config.yaml
          metricsServer:
            enabled: true
          collector:
            enabled: true
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
          pdb:
            enabled: true
            minAvailable: 1
          db:
            useExisting: true
            secret:
              name: litellm-secrets
              usernameKey: POSTGRESQL_USERNAME
              passwordKey: POSTGRESQL_PASSWORD
              endpointKey: POSTGRESQL_ENDPOINT
            deployStandalone: false
            connectionPool:
              enabled: true
              maxDbConnections: 20
              maxClientConn: 100
          redis:
            enabled: true
            architecture: standalone
            image:
              repository: bitnamilegacy/redis
              tag: 7.2.4-debian-12-r9
            sentinel:
              image:
                repository: bitnamilegacy/redis-sentinel
                tag: 7.2.4-debian-12-r7
            metrics:
              image:
                repository: bitnamilegacy/redis-exporter
                tag: 1.58.0-debian-12-r4
            volumePermissions:
              image:
                repository: bitnamilegacy/os-shell
                tag: 12-debian-12-r16
            sysctl:
              image:
                repository: bitnamilegacy/os-shell
                tag: 12-debian-12-r16
            kubectl:
              image:
                repository: bitnamilegacy/kubectl
                tag: 1.29.2-debian-12-r3
            coordination:
              enabled: true
          serviceMonitor:
            enabled: true
  destination:
    server: {{ .Values.destination.server }}
    namespace: litellm
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
{{- end }}
