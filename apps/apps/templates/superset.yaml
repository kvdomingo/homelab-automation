{{- if not .Values.disableSuperset }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superset
  namespace: {{ include "apps.argocdNamespace" . | quote }}
  finalizers:
    {{- include "apps.finalizers" . | nindent 4 }}
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: https://github.com/kvdomingo/homelab-automation.git
      targetRevision: main
      path: infisical-secrets/superset
    - repoURL: https://apache.github.io/superset
      chart: superset
      targetRevision: 0.22.8
      helm:
        releaseName: superset
        valuesObject:
          envFromSecrets:
            - superset-secrets
          configOverrides:
            secret: |
              import os
              SECRET_KEY = os.environ.get("SECRET_KEY")
          image:
            repository: apache/superset
            tag: 6.1.0
          ingress:
            enabled: true
            annotations:
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: "Superset"
              gethomepage.dev/group: "Analytics"
              gethomepage.dev/icon: "apache.png"
              gethomepage.dev/ping: "https://superset.{{ .Values.ingress.baseDomain }}/health"
            pathType: Prefix
            hosts:
              - 'superset.{{ .Values.ingress.baseDomain }}'
          supersetNode:
            resources:
              requests:
                cpu: 100m
            autoscaling:
              enabled: true
              minReplicas: 2
              maxReplicas: 5
              targetCPUUtilizationPercentage: 80
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
              maxUnavailable: false
            connections:
              db_host: 10.10.10.103
              db_port: "5432"
              db_user: superset
              db_name: superset
          supersetWorker:
            resources:
              requests:
                cpu: 250m
            # The chart's default `-A superset...` ping boots all of Superset
            # (~9 CPU-s per probe), which kept the HPA pinned at max.
            livenessProbe:
              exec:
                command:
                  - sh
                  - -c
                  - celery -b "$REDIS_PROTO://$REDIS_HOST:$REDIS_PORT/$REDIS_CELERY_DB" inspect ping -d celery@$HOSTNAME
            autoscaling:
              enabled: true
              minReplicas: 2
              maxReplicas: 5
              targetCPUUtilizationPercentage: 80
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
              maxUnavailable: false
          supersetCeleryBeat:
            enabled: true
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
              maxUnavailable: false
          supersetCeleryFlower:
            enabled: false
            podDisruptionBudget:
              enabled: false
              minAvailable: 1
              maxUnavailable: false
          supersetWebsockets:
            enabled: false
            podDisruptionBudget:
              enabled: false
              minAvailable: 1
              maxUnavailable: false
          init:
            createAdmin: false
            adminUser:
              username: admin
              firstname: Kenneth
              lastname: Domingo
              email: ""
              password: ""
          postgresql:
            enabled: false
          redis:
            image:
              repository: bitnamilegacy/redis
              tag: 7.2.4-debian-11-r4
            master:
              persistence:
                enabled: true
              # jemalloc crashes on the Pi 5's 16K page size
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/arch
                            operator: NotIn
                            values: [ arm64, arm ]
          bootstrapScript: |
            #!/bin/bash

            uv pip install \
              --no-cache \
              --python /app/.venv/bin/python \
              fastmcp \
              prophet \
              psycopg2-binary

            if [ ! -f ~/bootstrap ]; then
              echo "Running Superset with uid {{ .Values.runAsUser }}" > ~/bootstrap;
            fi

  destination:
    server: {{ .Values.destination.server }}
    namespace: superset
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
{{- end }}
