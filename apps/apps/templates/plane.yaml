{{- if not .Values.disablePlane }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane
  namespace: {{ include "apps.argocdNamespace" . | quote }}
  finalizers:
    {{- include "apps.finalizers" . | nindent 4 }}
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://helm.plane.so/
    chart: plane-ce
    targetRevision: 1.8.6
    helm:
      releaseName: plane
      valuesObject:
        planeVersion: v1.2.0
        api:
          # The chart names the migrate Job by Release.Revision (always 1 under
          # ArgoCD), so a changed Job can only be applied by recreating it.
          # api.annotations also lands on the api Deployment.
          annotations:
            argocd.argoproj.io/sync-options: Force=true,Replace=true
        ingress:
          enabled: true
          appHost: "plane.{{ .Values.ingress.baseDomain }}"
          ingressClass: traefik
          ingress_annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Plane"
            gethomepage.dev/group: "Admin"
            gethomepage.dev/icon: "plane.png"
            gethomepage.dev/ping: "plane.{{ .Values.ingress.baseDomain }}"
        redis:
          storageClass: nfs-client
        postgres:
          local_setup: false
        minio:
          local_setup: false
        rabbitmq:
          storageClass: nfs-client
        external_secrets:
          rabbitmq_existingSecret: plane-secrets
          pgdb_existingSecret: plane-secrets
          doc_store_existingSecret: plane-secrets
          app_env_existingSecret: plane-secrets
          live_env_existingSecret: plane-secrets
  destination:
    server: {{ .Values.destination.server }}
    namespace: plane
  # The chart stamps the migrate Job's pod template with `now` on every render.
  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/template/metadata/annotations/timestamp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      selfHeal: true
      prune: true
{{- end }}
