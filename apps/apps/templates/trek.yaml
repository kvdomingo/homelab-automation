{{- if not .Values.disableTrek }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trek
  namespace: {{ include "apps.argocdNamespace" . | quote }}
  finalizers:
    {{- include "apps.finalizers" . | nindent 4 }}
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: https://github.com/kvdomingo/homelab-automation.git
      targetRevision: main
      path: infisical-secrets/trek
    - repoURL: https://chart.liketrek.com
      chart: trek
      targetRevision: 5.1.1
      helm:
        releaseName: trek
        valuesObject:
          image:
            repository: mauriceboe/trek
            tag: 5.1.1
          env:
            TZ: Asia/Manila
            ALLOWED_ORIGINS: trek.lab.kvd.studio,trek.kvd.studio
            APP_URL: https://trek.kvd.studio
            SESSION_DURATION: 7d
            TRUST_PROXY: "1"
            ALLOW_INTERNAL_NETWORK: "true"
          existingSecret: trek-secrets
          persistence:
            enabled: true
            data:
              size: 4Gi
            uploads:
              size: 8Gi
          ingress:
            enabled: true
            annotations:
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: "Trek"
              gethomepage.dev/group: "Apps"
              gethomepage.dev/icon: "https://avatars.githubusercontent.com/u/306517056"
              gethomepage.dev/ping: "https://trek.lab.kvd.studio/api/health"
            hosts:
              - host: trek.lab.kvd.studio
                paths:
                  - /
              - host: trek.kvd.studio
                paths:
                  - /
  destination:
    server: {{ .Values.destination.server }}
    namespace: trek
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
{{- end }}
