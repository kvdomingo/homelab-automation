repositories:
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/
  - name: coredns
    url: https://coredns.github.io/helm/

releases:
  - name: metrics-server
    namespace: kube-system
    chart: metrics-server/metrics-server
    version: 3.14.0
    values: [ metrics-server.yaml ]
  - name: coredns
    namespace: kube-system
    chart: coredns/coredns
    version: 1.48.2
    values: [ coredns.yaml ]
