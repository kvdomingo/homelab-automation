{{- if not .Values.disableLoki }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: {{ include "apps.argocdNamespace" . | quote }}
  finalizers:
    {{- include "apps.finalizers" . | nindent 4 }}
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.5.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2026-10-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          storage:
            type: s3
            bucketNames:
              chunks: loki
              ruler: loki
            s3:
              endpoint: 10.10.10.100:7070
              accessKeyId: ${S3_ACCESS_KEY_ID}
              secretAccessKey: ${S3_SECRET_ACCESS_KEY}
              s3ForcePathStyle: true
              insecure: true
          limits_config:
            retention_period: 720h
          compactor:
            retention_enabled: true
            delete_request_store: s3
        singleBinary:
          replicas: 1
          annotations:
            secrets.infisical.com/auto-reload: "true"
          extraArgs:
            - -config.expand-env=true
          extraEnvFrom:
            - secretRef:
                name: monitoring-secrets
          persistence:
            storageClass: longhorn
            size: 5Gi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        minio:
          enabled: false
  destination:
    server: {{ .Values.destination.server }}
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
{{- end }}
