{{- if not .Values.disableVault }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: {{ include "apps.argocdNamespace" . | quote }}
  finalizers:
    {{- include "apps.finalizers" . | nindent 4 }}
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.27.0
    helm:
      releaseName: vault
      valuesObject:
        injector:
          metrics:
            enabled: true
        server:
          ingress:
            enabled: true
            annotations:
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: "Vault"
              gethomepage.dev/group: "Security"
              gethomepage.dev/icon: "vault.png"
              gethomepage.dev/ping: "vault.lab.kvd.studio"
            hosts:
              - host: vault.lab.kvd.studio
                paths: [ ]
            activeService: false
          auditStorage:
            enabled: true
          standalone:
            enabled: true
          ha:
            enabled: false
        ui:
          enabled: true
        csi:
          enabled: true
        serverTelemetry:
          serviceMonitor:
            enabled: true
  destination:
    server: {{ .Values.destination.server }}
    namespace: vault
  # The injector patches its own caBundle at runtime.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      selfHeal: true
      prune: true
{{- end }}
