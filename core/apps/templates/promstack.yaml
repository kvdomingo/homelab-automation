{{- if not .Values.disablePromstack }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promstack
  namespace: {{ include "apps.argocdNamespace" . | quote }}
  finalizers:
    {{- include "apps.finalizers" . | nindent 4 }}
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: https://github.com/kvdomingo/homelab-automation.git
      targetRevision: main
      path: infisical-secrets/monitoring
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.13.1
      helm:
        releaseName: kube-prometheus-stack
        valuesObject:
          fullnameOverride: promstack
          additionalPrometheusRulesMap:
            object-storage:
              groups:
                - name: object-storage
                  rules:
                    - alert: ThanosSidecarUploadFailing
                      expr: increase(thanos_objstore_bucket_operation_failures_total{job="promstack-thanos-discovery"}[15m]) > 0
                      for: 15m
                      labels:
                        severity: warning
                      annotations:
                        summary: Thanos sidecar is failing to upload blocks to object storage.
                    - alert: ThanosCompactHalted
                      expr: thanos_compact_halted == 1
                      for: 5m
                      labels:
                        severity: warning
                      annotations:
                        summary: Thanos compactor has halted; retention and downsampling are stopped.
          prometheusOperator:
            admissionWebhooks:
              certManager:
                enabled: true
          prometheus:
            thanosService:
              enabled: true
            thanosServiceMonitor:
              enabled: true
            prometheusSpec:
              scrapeInterval: 30s
              retention: 14d
              retentionSize: 8GB
              ruleSelectorNilUsesHelmValues: false
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              probeSelectorNilUsesHelmValues: false
              scrapeConfigSelectorNilUsesHelmValues: false
              # No limit: OOM loops during compaction are worse than overcommit.
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: longhorn
                    accessModes: [ ReadWriteOnce ]
                    resources:
                      requests:
                        storage: 10Gi
              thanos:
                objectStorageConfig:
                  existingSecret:
                    name: monitoring-secrets
                    key: objstore.yml
          alertmanager:
            alertmanagerSpec:
              secrets:
                - monitoring-secrets
              storage:
                volumeClaimTemplate:
                  spec:
                    storageClassName: longhorn
                    accessModes: [ ReadWriteOnce ]
                    resources:
                      requests:
                        storage: 1Gi
            config:
              route:
                receiver: discord
                routes:
                  - receiver: healthchecks
                    matchers:
                      - alertname = "Watchdog"
                    group_wait: 0s
                    group_interval: 1m
                    repeat_interval: 1m
                  - receiver: "null"
                    matchers:
                      - alertname = "InfoInhibitor"
              receivers:
                - name: "null"
                - name: discord
                  discord_configs:
                    - webhook_url_file: /etc/alertmanager/secrets/monitoring-secrets/DISCORD_WEBHOOK_URL
                      send_resolved: true
                - name: healthchecks
                  webhook_configs:
                    - url_file: /etc/alertmanager/secrets/monitoring-secrets/HEALTHCHECKS_PING_URL
                      send_resolved: false
          grafana:
            annotations:
              secrets.infisical.com/auto-reload: "true"
            admin:
              existingSecret: monitoring-secrets
              userKey: GRAFANA_ADMIN_USER
              passwordKey: GRAFANA_ADMIN_PASSWORD
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                gethomepage.dev/enabled: "true"
                gethomepage.dev/name: "Grafana"
                gethomepage.dev/group: "Monitoring"
                gethomepage.dev/icon: "grafana.svg"
                gethomepage.dev/ping: "https://grafana.lab.kvd.studio/api/health"
              hosts:
                - grafana.lab.kvd.studio
            sidecar:
              datasources:
                url: http://thanos-query.monitoring:10902
            additionalDataSources:
              - name: Loki
                type: loki
                uid: loki
                access: proxy
                url: http://loki.monitoring:3100
          kubeEtcd:
            endpoints: &controlPlane
              - 10.10.10.110
              - 10.10.10.111
              - 10.10.10.112
              - 10.10.10.151
          kubeControllerManager:
            endpoints: *controlPlane
          kubeScheduler:
            endpoints: *controlPlane
          # k3s runs kube-proxy in-process, so there are no pods to discover.
          kubeProxy:
            endpoints:
              - 10.10.10.110
              - 10.10.10.111
              - 10.10.10.112
              - 10.10.10.151
              - 10.10.10.152
              - 10.10.10.153
              - 10.10.10.154
  destination:
    server: {{ .Values.destination.server }}
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
{{- end }}
