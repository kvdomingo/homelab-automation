apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ include "wallos.fullname" . }}-configmap'
  labels:
    {{- include "wallos.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  SSRF_ALLOWLIST: "litellm.lab.kvd.studio,litellm.kvd.studio"
