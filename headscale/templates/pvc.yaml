apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: '{{ include "headscale.fullname" . }}-lib'
  labels:
    {{ include "headscale.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
