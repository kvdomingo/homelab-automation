apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ include "ai-memory.fullname" . }}-configmap'
  labels:
    {{- include "ai-memory.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  AI_MEMORY_BIND: "0.0.0.0:{{ .Values.service.port }}"
  AI_MEMORY_ALLOWED_HOSTS: >-
    ["memory.lab.kvd.studio", "memory.kvd.studio", "localhost", "127.0.0.1"]
  AI_MEMORY_AUTH__TRUSTED_PROXY_CIDRS: >-
    ["10.0.0.0/8", "192.168.0.0/16", "172.16.0.0/12", "127.0.0.1/8"]
  AI_MEMORY_LLM_PROVIDER: "gemini"
  AI_MEMORY_LLM_MODEL: "gemini-3.8-flash"
  AI_MEMORY_EMBEDDING_PROVIDER: "gemini"
  AI_MEMORY_EMBEDDING_MODEL: "gemini-embedding-2"
  AI_MEMORY_EMBEDDING_DIM: "768"
  AI_MEMORY_GEMINI_SAFE_SCHEMAS: "true"
  AI_MEMORY_DREAM__ENABLED: "true"
  AI_MEMORY_DREAM__INTERVAL_SECS: "86400"
  AI_MEMORY_MAINTENANCE__ENABLED: "true"
