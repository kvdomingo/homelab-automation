{{- if .Values.smokeTest.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "primerdriver.fullname" . }}-smoke-test
  labels:
    {{- include "primerdriver.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  # Covers the wait for CI to publish the image.
  activeDeadlineSeconds: 900
  template:
    metadata:
      # Not selectorLabels: the Services and the Rollout must not select this pod.
      labels:
        app.kubernetes.io/name: {{ include "primerdriver.name" . }}-smoke-test
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: smoke-test
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
          # Probes its own server: the preview Service may still point at the
          # previous, healthy ReplicaSet.
          args:
            - |
              /primerdriver/docker-entrypoint.sh &
              for _ in $(seq {{ div .Values.smokeTest.timeoutSeconds 5 }}); do
                python -c "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:$PORT/api/health', timeout=5).status != 200)" && exit 0
                sleep 5
              done
              exit 1
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
